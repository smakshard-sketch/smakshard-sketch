<style>
:root{--bg:#0a0a0b;--s:#111113;--s2:#18181b;--b:#27272b;--t:#fafafa;--t2:#b4b4bc;--t3:#80808a;--a:#2f6bff;--ok:#2dd4a0;--warn:#ffb020;--bad:#ff5a5f}
@media (prefers-color-scheme:light){:root{--bg:#f6f6f7;--s:#fff;--s2:#f1f1f3;--b:#e3e3e7;--t:#0a0a0b;--t2:#52525b;--t3:#71717a}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:16px 16px 90px;max-width:1040px;margin:0 auto}
h1{font-size:20px;font-weight:700;letter-spacing:.5px}h2{font-size:16px;margin:18px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.muted{color:var(--t3);font-size:13px}
.card{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--t2);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;background:var(--s2);color:var(--t);border:1px solid var(--b);border-radius:12px;padding:12px;font:inherit}
input:focus,select:focus{outline:2px solid var(--a);outline-offset:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
button{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--b);background:var(--s2);color:var(--t);padding:11px 14px;cursor:pointer}
button.p{background:var(--a);border-color:var(--a);color:#fff}button.d{color:var(--bad)}button.sm{padding:8px 11px;font-size:13px}
button:disabled{opacity:.5}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--b);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--t3);padding:11px 14px;white-space:nowrap}
.tabs button.on{color:var(--t);border-bottom-color:var(--a)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.chips button{border-radius:99px;padding:7px 13px;font-size:13px;white-space:nowrap;font-weight:500}
.chips button.on{background:var(--t);color:var(--bg);border-color:var(--t)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;border:1px solid var(--b)}
.ok{color:var(--ok);border-color:var(--ok)}.warn{color:var(--warn);border-color:var(--warn)}.bad{color:var(--bad);border-color:var(--bad)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:700;letter-spacing:1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:14px}
.kpi b{display:block;font-size:26px;font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hidden{display:none!important}

#toast.show{opacity:1;transform:none}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--b)}.list-row:first-child{border-top:0}

/* ---- Refonte : logo animé, tableau de bord, comptes, sécurité ---- */
:root{--a2:#7c5cff;--glow:rgba(47,107,255,.35)}
body{background:radial-gradient(900px 480px at 85% -10%,rgba(124,92,255,.16),transparent 60%),radial-gradient(700px 400px at -5% 0%,rgba(47,107,255,.14),transparent 60%),var(--bg);background-attachment:fixed}
.logo{position:relative;display:inline-grid;place-items:center;width:var(--s,44px);height:var(--s,44px);flex:none}
.logo img{width:100%;height:100%;border-radius:22%;display:block;position:relative;z-index:1;animation:lfloat 5s ease-in-out infinite}
.logo::before{content:"";position:absolute;inset:-6px;border-radius:30%;background:conic-gradient(from 0deg,var(--a),var(--a2),var(--ok),var(--a));filter:blur(10px);opacity:.55;animation:lspin 8s linear infinite}
.logo.big{--s:84px}.logo.big img{animation:lpop .9s cubic-bezier(.2,1.4,.3,1) both,lfloat 5s ease-in-out .9s infinite}
@keyframes lfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes lspin{to{transform:rotate(360deg)}}
@keyframes lpop{from{transform:scale(.5) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.brand{display:flex;align-items:center;gap:12px}.brand h1{line-height:1.1}.brand small{display:block;color:var(--t3);font-weight:500;font-size:12px;letter-spacing:.3px}
.login{min-height:78vh;display:grid;place-items:center}.login .box{width:100%;max-width:400px;text-align:center}
.login .box .card{text-align:left;margin-top:18px;animation:rise .6s .15s both}
.login h1{margin-top:16px;font-size:22px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card,.kpi{animation:rise .45s both}
.kpi{position:relative;overflow:hidden}.kpi small{display:block;color:var(--t3);font-size:12.5px;margin-top:2px}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--k,var(--a));opacity:.13}
.kpi.ok{--k:var(--ok)}.kpi.warn{--k:var(--warn)}.kpi.bad{--k:var(--bad)}.kpi.vio{--k:var(--a2)}
.kpi .delta{font-size:12px;font-weight:700;margin-left:6px}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
.grid2 .card{margin:0}
.ctitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.ctitle b{font-size:14.5px}
.chart{width:100%;height:auto;display:block}
.bar{transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dash 1.4s ease-out forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--t2);margin-top:8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--t3)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.feed .list-row{align-items:center}.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--s2);flex:none}
.feed .l{display:flex;gap:10px;align-items:center;min-width:0}.feed .l div{min-width:0}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px}
.urow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--b)}.urow:first-child{border-top:0}
.urow .l{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 260px}.urow .l>div{min-width:0}.urow b{overflow-wrap:anywhere}
.sec h3{font-size:15px;margin-bottom:4px}.sec p{color:var(--t2);font-size:13.5px;margin:2px 0 8px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--b)}.sw:first-of-type{border-top:0}
.sw>div:first-child{min-width:0}.sw small{display:block;color:var(--t3);font-size:12.5px;margin-top:2px}
.tg{position:relative;width:48px;height:28px;flex:none;border-radius:99px;border:1px solid var(--b);background:var(--s2);padding:0;transition:.25s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--t3);transition:.25s}
.tg.on{background:var(--a);border-color:var(--a)}.tg.on::after{left:22px;background:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s both}
.modal{width:100%;max-width:440px;background:var(--s);border:1px solid var(--b);border-radius:20px;padding:20px;animation:rise .3s both;max-height:90vh;overflow:auto}
.modal h3{font-size:17px;margin-bottom:6px}.modal p{color:var(--t2);font-size:14px;margin-bottom:10px;overflow-wrap:anywhere}.modal img.qr{width:200px;height:200px;background:#fff;border-radius:12px;padding:8px;display:block;margin:10px auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tabs button{transition:color .2s}.tabs button.on{font-weight:700}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}

function logo(size, cls) { return h('span', { class: 'logo ' + (cls || ''), style: size ? `--s:${size}px` : null }, h('img', { src: LOGO, alt: 'ÉCHÉANCE' })); }
function brand(sub) { return h('div', { class: 'brand' }, logo(44), h('div', {}, h('h1', {}, 'ÉCHÉANCE'), h('small', {}, sub || 'Administration'))); }
function getCfg() { return { url: CFG.supabaseUrl || store.get('adm_url') || '', key: CFG.supabaseKey || store.get('adm_key') || '' }; }
let authed = false, lastAct = Date.now(), guardsOn = false, reauthAt = 0;
const idleMin = () => Math.max(1, Number(store.get('adm_idle')) || 15);
const needReauth = () => store.get('adm_reauth') !== '0';
async function boot() {
  const c = getCfg();
  if (!c.url || !c.key) return renderSetup();
  sb = window.supabase.createClient(c.url, c.key);
  const { data } = await sb.auth.getSession();
  if (data && data.session) return enter(); renderLogin();
}
async function enter() {
  try {
    const l = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (l.data && l.data.nextLevel === 'aal2' && l.data.currentLevel !== 'aal2') return renderMfaChallenge();
  } catch (e) { /* MFA indisponible : on continue, le serveur décide */ }
  const ok = await loadAll();
  if (!ok) { await sb.auth.signOut({ scope: 'local' }); return renderLogin("Ce compte n'a pas accès à l'administration."); }
  authed = true; lastAct = Date.now(); startGuards(); renderMain();
}
async function lock(msg) { authed = false; try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {} renderLogin(msg); }
function startGuards() {
  if (guardsOn) return; guardsOn = true;
  for (const ev of ['click', 'keydown', 'touchstart', 'pointerdown']) addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true });
  setInterval(() => { if (authed && Date.now() - lastAct > idleMin() * 60000) lock(`Session fermée après ${idleMin()} min d'inactivité.`); }, 15000);
  setInterval(() => { if (authed && state.tab === 'dash' && !document.hidden && !document.querySelector('.modal-bg')) quietRefresh(); }, 60000);
  setInterval(updateAgo, 5000);
}

async function createLicense(f) {
  const name = f.name.value.trim(); if (!name) return toast('Le nom du client est obligatoire');
  const months = Number(f.months.value);
  const exp = addMonths(today(), months);
  const c = await sb.from('customers').insert({ name, phone: f.phone.value.trim() || null, email: f.email.value.trim() || null, notes: f.notes.value.trim() }).select().single();
  if (c.error) return toast(errMsg(c.error));

function convert(kind, raw) {
  const v = String(raw).trim();
  if (kind === 'req') { if (!v) throw new Error('Le nom ne peut pas être vide'); return v; }
  if (kind === 'null') return v || null;
  if (kind === 'txt') return v;
  if (kind === 'datereq') { if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) throw new Error('Date de fin obligatoire : AAAA-MM-JJ'); return v; }
  if (kind === 'date') { if (!v) return null; if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) throw new Error('Date attendue : AAAA-MM-JJ'); return v; }
  if (kind === 'int') { const n = parseInt(v, 10); if (!(n >= 1 && n <= 20)) throw new Error('Nombre entre 1 et 20'); return n; }
  if (kind === 'num') { const n = Number(v.replace(',', '.')); if (!(n >= 0)) throw new Error('Montant invalide'); return n; }
  return v;
}

  openModal({ title: 'Changer le mot de passe', body: [a, b, err], actions: [{ label: 'Enregistrer', cls: 'p', onclick: async (close) => {
    if (a.value.length < 12) { err.textContent = '12 caractères minimum.'; return; } if (a.value !== b.value) { err.textContent = 'Les deux mots de passe diffèrent.'; return; }
    const r = await sb.auth.updateUser({ password: a.value }); if (r.error) { err.textContent = errMsg(r.error); return; }
    close(); logAct('setting', 'password', 'changé'); toast('Mot de passe changé ✓'); } }, { label: 'Annuler', onclick: (c) => c() }] });
}
async function signOutEverywhere() {
  const t = await ask({ title: 'Déconnecter tous vos appareils ?', text: "Toutes vos sessions d'administration seront fermées, y compris celle-ci.", ok: 'Tout déconnecter', danger: true }); if (t === null) return;
  logAct('setting', 'sessions', 'toutes fermées'); await new Promise((r) => setTimeout(r, 400));
  try { await sb.auth.signOut({ scope: 'global' }); } catch (e) {} authed = false; renderLogin('Toutes les sessions ont été fermées.');
}
function viewSecurity() {
  const f = (state.factors || []).find((x) => x.status === 'verified'), me = state.me || {};
  const sec = (title, desc, ...kids) => h('div', { class: 'card sec' }, h('h3', {}, title), h('p', {}, desc), ...kids);
  return h('div', {},
    sec('Double authentification', "Un code à 6 chiffres, généré par une application sur votre téléphone, en plus du mot de passe. C'est la protection la plus importante pour un compte administrateur.",
      state.factors === null ? h('p', { class: 'muted' }, 'Indisponible : activez la double authentification (TOTP) dans Supabase, Authentication, Sign In / Providers, Multi-Factor.') :
      h('div', {}, h('div', { class: 'sw' }, h('div', {}, h('b', {}, f ? 'Activée' : 'Non activée'), h('small', {}, f ? 'Application enregistrée' : 'Recommandé avant le lancement')),
        f ? h('button', { class: 'sm d', onclick: () => disableMfa(f) }, 'Retirer') : h('button', { class: 'sm p', onclick: enrollMfa }, 'Activer')),
      h('div', { class: 'sw' }, h('div', {}, h('b', {}, 'Exiger le code à chaque connexion'), h('small', {}, "Sans code valide, même le bon mot de passe n'ouvre rien (côté serveur).")), tg(state.settings.require_mfa === 'true', toggleRequireMfa)))),
    sec('Session', "Fermeture automatique quand vous n'utilisez plus la page.",
      h('div', { class: 'sw' }, h('div', {}, h('b', {}, 'Inactivité avant verrouillage')), h('select', { style: 'width:auto', onchange: (e) => { store.set('adm_idle', e.target.value); toast('Enregistré'); } },
        [5, 15, 30, 60].map((m) => h('option', { value: m, selected: m === idleMin() }, `${m} min`)))),
      h('div', { class: 'sw' }, h('div', {}, h('b', {}, 'Redemander le mot de passe'), h('small', {}, 'Pour bloquer, supprimer ou purger un compte, et changer la sécurité.')), tg(needReauth(), () => { store.set('adm_reauth', needReauth() ? '0' : '1'); renderMain(); }))),
    sec('Compte', `Connecté en tant que ${me.email || '—'}${me.since ? ' · dernière connexion ' + new Date(me.since).toLocaleString('fr-FR') : ''}.`,
      h('div', { class: 'acts' }, h('button', { class: 'sm', onclick: changePassword }, 'Changer le mot de passe'), h('button', { class: 'sm d', onclick: signOutEverywhere }, 'Déconnecter tous mes appareils'))),
    sec('Bonnes pratiques', "N'ajoutez jamais d'autre administrateur sans double authentification. Gardez l'adresse de cette page privée. En cas de perte de l'application d'authentification, la procédure de secours est dans le fichier SQL (dernière ligne de la section 12)."));
}

/* ---------- écrans ---------- */
function renderMain() {
  const pend = state.orders.filter((o) => o.status === 'pending').length;
  const tabs = [['dash', 'Tableau'], ['orders', pend ? `Commandes (${pend})` : 'Commandes'], ['licences', 'Licences'], ['new', 'Nouvelle'], ['payments', 'Paiements'], ['users', 'Comptes'], ['tables', 'Données'], ['journal', 'Journal'], ['security', 'Sécurité']];
  $app.replaceChildren(
    h('div', { class: 'top' }, brand('Administration'), h('button', { class: 'sm', onclick: () => lock('') }, 'Verrouiller')),
    h('div', { class: 'tabs' }, tabs.map(([k, t]) => h('button', { class: state.tab === k ? 'on' : '', onclick: async () => { state.tab = k; state.created = null; if (k === 'tables') await loadTable(); if (k === 'security') await loadFactors(); renderMain(); } }, t))),
    state.tab === 'orders' ? viewOrders() : state.tab === 'licences' ? viewLicenses() : state.tab === 'new' ? viewNew() : state.tab === 'payments' ? viewPayments() : state.tab === 'users' ? viewUsers() : state.tab === 'tables' ? viewTables() : state.tab === 'journal' ? viewJournal() : state.tab === 'security' ? viewSecurity() : viewDash());
}
boot();
</script>
</body>
</html>
